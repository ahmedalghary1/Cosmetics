{% extends "dashboard/base.html" %}{% block title %}البانرات{% endblock %}{% block dashboard_content %}<div class="dashboard-heading"><h1>البانرات</h1><a class="btn btn-primary" href="{% url 'dashboard:banner_add' %}">+ إضافة بانر</a></div><section class="cards-admin">{% for banner in banners %}<article class="dashboard-panel banner-admin">{% if banner.image %}<img src="{{ banner.image.url }}" alt="">{% endif %}<div><b>{{ banner.title }}</b><span>{{ banner.get_position_display }}</span><div class="table-actions"><a href="{% url 'dashboard:banner_edit' banner.pk %}">تعديل</a><form method="post" action="{% url 'dashboard:generic_delete' 'banner' banner.pk %}" data-confirm="حذف البانر؟">{% csrf_token %}<button class="danger-text">حذف</button></form></div></div></article>{% endfor %}</section>{% endblock %}
