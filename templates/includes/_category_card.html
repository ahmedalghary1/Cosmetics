{% load static %}
<a class="category-card" href="{{ category.get_absolute_url }}">{% if category.image %}<img src="{{ category.image.url }}" alt="{{ category.name }}" width="600" height="800" loading="lazy">{% else %}<img src="{% static 'images/demo/cream.webp' %}" alt="{{ category.name }}" width="600" height="800" loading="lazy">{% endif %}<span>{{ category.name }}</span></a>
